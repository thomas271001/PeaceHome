<title>Peace Home Kidney Screening</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap">
<style>
/* Layout: the resident app is one calm column, one question per screen, grouped option lists and a
   bottom action bar within thumb reach. The care team gets a separate sidebar, list and detail view
   that collapses to list-then-detail on a phone. The one signature element is the "when to book" rail. */
:root {
  --bg: #EFF2F6; --surface: #FFFFFF; --surface-2: #F6F8FB; --ink: #0E1620; --ink-2: #4B5866;
  --line: #DAE0E8; --control: #7A8696;
  --accent: #0B5E8F; --accent-ink: #FFFFFF; --accent-soft: #E1EDF6;
  --high: #A5381A; --high-bg: #FBE7DF; --med: #735000; --med-bg: #F8EBC8; --low: #1B6642; --low-bg: #DDF0E5;
  --font-ui: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Malayalam', sans-serif;
  --font-display: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Malayalam', sans-serif;
  --glass: rgba(239, 242, 246, .82);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090D12; --surface: #141A21; --surface-2: #1C242D; --ink: #EAF0F6; --ink-2: #A3B0BE;
    --line: #28323D; --control: #7B8896; --accent: #6DB8E8; --accent-ink: #06141F; --accent-soft: #14293A;
    --high: #FF9C7F; --high-bg: #3B1D14; --med: #F2C65F; --med-bg: #382A0B; --low: #7FD6A3; --low-bg: #12301F;
    --glass: rgba(9, 13, 18, .82); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090D12; --surface: #141A21; --surface-2: #1C242D; --ink: #EAF0F6; --ink-2: #A3B0BE;
  --line: #28323D; --control: #7B8896; --accent: #6DB8E8; --accent-ink: #06141F; --accent-soft: #14293A;
  --high: #FF9C7F; --high-bg: #3B1D14; --med: #F2C65F; --med-bg: #382A0B; --low: #7FD6A3; --low-bg: #12301F;
  --glass: rgba(9, 13, 18, .82); color-scheme: dark;
}
@media (prefers-contrast: more) {
  :root:not([data-theme="dark"]) { --ink: #000000; --ink-2: #2E3945; --control: #4A5663; --line: #8A96A3; --accent: #08486F; --accent-soft: #D3E5F2; }
}
@media (prefers-contrast: more) and (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --ink: #FFFFFF; --ink-2: #CBD5E0; --control: #AEB9C6; --line: #5B6773; --accent: #9CD0F2; --accent-soft: #1D3C52; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 1.0625rem; line-height: 1.5;
  padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
html[lang="ml"] body { line-height: 1.75; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, p { margin: 0; overflow-wrap: anywhere; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; }
.tnum { font-variant-numeric: tabular-nums; }

/* shared controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 24px; border-radius: 14px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.0625rem; }
.btn:active { filter: brightness(.9); }
.btn.secondary { background: transparent; color: var(--accent); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--accent); }
.btn.danger { background: transparent; border-color: var(--high); color: var(--high); }
.btn.small { min-height: 44px; padding: 8px 16px; font-size: .9375rem; border-radius: 12px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.seg { display: inline-flex; border: 1.5px solid var(--control); border-radius: 12px; overflow: hidden; background: var(--surface); }
.tools { display: flex; align-items: center; gap: 8px; }
.tsw { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0; background: transparent; border: 0; border-radius: 16px; }
.tsw .trk { position: relative; display: block; width: 58px; height: 32px; border-radius: 16px; border: 2px solid var(--control); background: var(--surface); }
.tsw .bg { position: absolute; top: 6px; color: var(--ink-2); display: block; line-height: 0; }
.tsw .bg.l { left: 6px; } .tsw .bg.r { right: 6px; }
.tsw .th { position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; transition: transform .2s ease; }
.tsw[aria-checked="true"] .th { transform: translateX(26px); }
@media (prefers-reduced-motion: reduce) { .tsw .th { transition: none; } }
.seg { max-width: 100%; }
.seg button { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; min-height: 44px; padding: 6px 14px; font-size: .9375rem; overflow-wrap: anywhere; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.grouplabel { font-size: .9375rem; color: var(--ink-2); margin: 24px 16px 8px; }
.group { background: var(--surface); border-radius: 16px; overflow: hidden; border: 1.5px solid var(--line); }
.group > * + * { border-top: 1.5px solid var(--line); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 56px; padding: 12px 16px; background: transparent; border: 0; text-align: left; font-size: 1.0625rem; }
.row .lbl { min-width: 0; overflow-wrap: anywhere; }
.row[aria-checked="true"], .row[aria-pressed="true"] { background: var(--accent-soft); font-weight: 700; }
.row .tick { flex: none; width: 28px; height: 28px; display: grid; place-items: center; color: var(--accent); }
.row .tick.box { border: 2px solid var(--control); border-radius: 50%; color: transparent; }
.row[aria-checked="true"] .tick.box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row.subtle .lbl { color: var(--ink-2); }
.row.subtle[aria-checked="true"] .lbl { color: var(--ink); }
.field { display: grid; gap: 6px; }
.field > label, .field > .flabel { font-weight: 700; font-size: .9375rem; }
.input, select.input { width: 100%; min-height: 52px; padding: 8px 14px; background: var(--surface); border: 2px solid var(--control); border-radius: 12px; font-size: 1.0625rem; }
.input[aria-invalid="true"] { border-color: var(--high); }
.unit { position: relative; }
.unit .input { padding-right: 72px; }
.input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.input[type=number]::-webkit-inner-spin-button, .input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.unit span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }
.help { font-size: .9375rem; color: var(--ink-2); }
.errmsg { font-size: .9375rem; color: var(--high); font-weight: 700; }

/* resident app */
.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding-top: 12px; min-height: 64px; }
.topbar .btn.quiet { padding-left: 4px; margin-left: -4px; }
.progress { margin: 4px 0 24px; }
.progress .cap { font-size: .9375rem; color: var(--ink-2); margin-bottom: 8px; }
.progress .track { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress .track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
main.screen { flex: 1; padding-bottom: 24px; }
main.screen:focus { outline: none; }
.title { font-size: 2.125rem; line-height: 1.15; margin: 16px 0 12px; }
.qh { font-size: 1.625rem; line-height: 1.3; margin-bottom: 20px; }
.qh:focus { outline: none; }
html[lang="ml"] .title { line-height: 1.4; } html[lang="ml"] .qh { line-height: 1.55; }
.lead { color: var(--ink-2); margin-bottom: 8px; }
.note { margin-top: 12px; font-size: .9375rem; color: var(--ink-2); }
.bar { position: sticky; bottom: 0; margin-inline: -16px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1.5px solid var(--line); display: grid; gap: 8px; }
@supports (backdrop-filter: blur(10px)) or (-webkit-backdrop-filter: blur(10px)) {
  .bar { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); }
}
@media (prefers-reduced-transparency: reduce) { .bar { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; } }
.bar .btn { width: 100%; }
.footer { text-align: center; font-size: .875rem; color: var(--ink-2); padding: 16px 0; }
.footer .btn { margin-top: 4px; }

/* result and the "when to book" rail */
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: .9375rem; font-weight: 700; color: var(--accent); margin-top: 16px; }
.done { display: flex; gap: 12px; align-items: flex-start; margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--low-bg); color: var(--low); font-weight: 700; }
.saved { margin-top: 16px; font-size: .9375rem; color: var(--ink-2); }

/* contact sheet */
dialog.sheet { border: 0; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, 100%); max-width: 100%; margin: auto auto 0; border-radius: 22px 22px 0 0; max-height: 92dvh; overflow: auto; }
dialog.sheet::backdrop { background: rgba(0, 0, 0, .45); }
@media (min-width: 640px) { dialog.sheet { margin: auto; border-radius: 22px; } }
.sheet form { padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.sheethead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheethead h2 { font-size: 1.375rem; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--control); margin: 8px auto 4px; opacity: .6; }

/* care team */
.carewrap { max-width: 1280px; margin: 0 auto; padding-bottom: 40px; }
.caretop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 0; }
.caretop h1 { font-size: 1.625rem; margin-right: auto; }
.care { display: grid; grid-template-columns: 1fr; gap: 16px; }
.care .side { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.side .item { text-align: left; flex: none; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border: 1.5px solid var(--control); border-radius: 999px; background: var(--surface); font-size: .9375rem; }
.side .item[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.side .count { font-variant-numeric: tabular-nums; opacity: .85; }
.side .sep { display: none; }
.listpane, .detailpane { min-width: 0; }
.care.show-detail .listpane, .care.show-detail .side { display: none; }
.care:not(.show-detail) .detailpane { display: none; }
.search { margin-bottom: 12px; }
.recs { display: grid; gap: 8px; }
.rec { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; width: 100%; text-align: left; min-height: 64px; padding: 12px 16px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; }
.rec[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.rec .name { font-weight: 700; overflow-wrap: anywhere; }
.rec .sub { grid-column: 2; font-size: .9375rem; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.tag { font-size: .875rem; border: 1.5px solid var(--control); border-radius: 8px; padding: 0 8px; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 2px 12px 2px 10px; border-radius: 999px; font-weight: 700; font-size: .9375rem; }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 12px 16px; margin-bottom: 12px; border-radius: 14px; background: var(--med-bg); color: var(--med); font-size: .9375rem; }
.banner.info { background: var(--accent-soft); color: var(--ink); }
.empty { padding: 32px 16px; text-align: center; color: var(--ink-2); border: 2px dashed var(--control); border-radius: 16px; display: grid; gap: 16px; justify-items: center; }
.dhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 8px; }
.dhead h2 { font-size: 1.625rem; margin-right: auto; overflow-wrap: anywhere; }
.kv { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 12px 16px; }
.kv > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.kv > span:last-child { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.kv .u { color: var(--med); }
.stepper { width: 96px; min-height: 44px; text-align: right; font-variant-numeric: tabular-nums; padding: 4px 10px; }
.only-compact { display: inline-flex; }
@media (min-width: 1000px) {
  .care { grid-template-columns: 250px 380px minmax(0, 1fr); align-items: start; }
  .care .side { flex-direction: column; overflow: visible; padding: 0; gap: 4px; }
  .side .item { border: 0; border-radius: 12px; justify-content: space-between; background: transparent; padding: 8px 14px; font-size: 1rem; }
  .side .item[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); }
  .side .item .l { display: inline-flex; align-items: center; gap: 8px; }
  .side .sep { display: block; height: 1.5px; background: var(--line); margin: 8px 0; }
  .care.show-detail .listpane, .care.show-detail .side, .care:not(.show-detail) .detailpane { display: block; }
  .care .side { display: flex; }
  .only-compact { display: none; }
  .detailpane { position: sticky; top: 8px; }
}
@media (max-width: 480px) { .title { font-size: 1.875rem; } .qh { font-size: 1.5rem; } }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.why { margin-top: 12px; color: var(--ink-2); }
.subhead { font-size: 1.1875rem; margin: 28px 0 12px; }
.st { flex: none; }
.eyebrow .st { color: var(--accent); }
.path { list-style: none; margin: 0; padding: 0; }
.path > li { position: relative; padding: 0 0 22px 44px; }
.path > li::before { content: ''; position: absolute; left: 13px; top: 30px; bottom: 2px; width: 2px; background: var(--line); }
.path > li:last-child { padding-bottom: 0; }
.path > li:last-child::before { display: none; }
.path .dot { position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--control); background: var(--surface); font-size: .875rem; font-weight: 700; color: var(--ink-2); }
.path > li.is-done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.path > li.now .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); animation: settle .5s ease-out both; }
.path .ptitle { font-weight: 700; padding-top: 2px; overflow-wrap: anywhere; }
.path .tests { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; color: var(--ink-2); font-size: .9375rem; }
.path .tests li { padding: 10px 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; overflow-wrap: anywhere; }
.path .tests b { color: var(--ink); }
@keyframes settle { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .path > li.now .dot { animation: none; } }
.rec .ic { color: var(--ink-2); display: inline-flex; } .rec .ic.yes { color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 2px 12px 2px 10px; border-radius: 999px; font-weight: 700; font-size: .9375rem; }
.pill.yes { background: var(--accent-soft); color: var(--accent); }
.pill.no { background: var(--surface-2); color: var(--ink-2); border: 1.5px solid var(--line); }
</style>

  /* ---------- render ---------- */
  function render() {

  /* ---------- storage ---------- */
  function loadQueue() { try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch (e) { return []; } }
  function saveQueue() { try { localStorage.setItem(QKEY, JSON.stringify(S.queue)); } catch (e) { /* storage unavailable */ } }
  function strip(r) { return { schema: SCHEMA, answers: r.answers, createdAt: r.createdAt, lang: r.lang, assisted: !!r.assisted, contact: r.contact || null, sample: !!r.sample }; }
  function enqueue(r) { S.queue = S.queue.filter(function (x) { return x.id !== r.id; }); S.queue.push(Object.assign({ schema: SCHEMA }, r)); saveQueue(); }
  async function persist(r) {
    if (S.db) { try { await S.db.doc('screenings/' + r.id).set(strip(r)); return 'synced'; } catch (e) { /* fall through */ } }
    enqueue(r); return 'queued';
  }
  var syncing = false;
  async function syncQueue() {
    if (!S.db || syncing || !S.queue.length) return;
    syncing = true;
    try {
      var items = S.queue.slice();
      for (var i = 0; i < items.length; i++) {
        try { await S.db.doc('screenings/' + items[i].id).set(strip(items[i])); S.queue = S.queue.filter(function (x) { return x.id !== items[i].id; }); saveQueue(); }
        catch (e) { break; }
      }
    } finally { syncing = false; }
    if (S.view === 'care') render();
  }

  /* ---------- flow ---------- */
  function copy(o) { return JSON.parse(JSON.stringify(o)); }
  function completeAnswers() {
    var a = {}; a.age = S.a.age;
    PART_I.forEach(function (x) { a[x.id] = S.a[x.id] === true; });
    PART_II.forEach(function (x) { if (!x.derived) a[x.id] = S.a[x.id] === true; });
    return a;
  }
  async function finish() {
    var ans = completeAnswers();
    S.res = scoreScreening(ans, S.cfg);
    S.rec = { id: 'r_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), schema: SCHEMA, createdAt: new Date().toISOString(), lang: S.lang, assisted: S.assisted, answers: copy(ans), contact: null, sample: false };
    S.screen = 'result'; S.saveState = ''; S.sheet = false; S.contactSent = false; S.contact = { name: '', mobile: '' }; S.focusQ = true;
    render(); window.scrollTo(0, 0);
    S.saveState = await persist(S.rec);
    var el = document.getElementById('savedLine'); if (el) el.textContent = savedText();
  }
  function resetFlow(keep) {
    S.a = {}; S.ack1 = false; S.ack2 = false; S.touched = false; S.stepIdx = 0; S.screen = 'welcome'; S.rec = null; S.res = null; S.sheet = false; S.contactSent = false;
    if (!keep) { S.consent = false; S.assisted = false; S.lang = 'ml'; }
  }
  async function sendContact() {
    var n = S.contact.name.trim(), m = S.contact.mobile.replace(/\s/g, ''), okN = !!n, okM = /^\d{10}$/.test(m);
    document.getElementById('cnErr').hidden = okN; document.getElementById('cmErr').hidden = okM;
    document.getElementById('cn').setAttribute('aria-invalid', String(!okN)); document.getElementById('cm').setAttribute('aria-invalid', String(!okM));
    if (!okN) { document.getElementById('cn').focus(); return; }
    if (!okM) { document.getElementById('cm').focus(); return; }
    S.rec.contact = { name: n, mobile: m };
    var queued = S.queue.some(function (x) { return x.id === S.rec.id; });
    if (queued || !S.db) { enqueue(S.rec); syncQueue(); }
    else {
      try { await S.db.doc('screenings/' + S.rec.id).update({ contact: S.rec.contact }); }
      catch (e) { enqueue(S.rec); S.saveState = 'queued'; }
    }
    var dlg = document.getElementById('sheet'); S.sheet = false; if (dlg && dlg.open) dlg.close();

  }

  /* ---------- care actions ---------- */
  function subscribe() {
    if (!S.db || S.subscribed) return; S.subscribed = true;
    S.db.collection('screenings').limit(1000).onSnapshot(function (snap) {
      var m = {}; snap.docs.forEach(function (d) { m[d.id] = d.data(); });
      S.records = m; S.dbErr = '';
      S.queue = S.queue.filter(function (q) { return !m[q.id] || JSON.stringify(strip(q)) !== JSON.stringify(strip(Object.assign({ id: q.id }, m[q.id]))); });
      saveQueue();
      if (S.view === 'care' && !document.activeElement.matches('input')) render();
    }, function (e) { S.dbErr = 'Could not load shared screenings (' + (e && e.code) + ').'; if (S.view === 'care') render(); });
  }
  /* Outside Claude there is no downloads capability, so use a normal browser download. */
  function downloadFile(name, text) {
    var url = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' }));
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function csvCell(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  async function exportCsv() {
    var recs = allRecords(), head = ['id', 'completed', 'completed_by', 'language', 'name', 'mobile', 'age', 'eligible_for_test', 'reason', 'part1_marked', 'part2_score', 'example'];
    PART_I.forEach(function (x) { head.push(x.id); }); PART_II.forEach(function (x) { head.push(x.id); });
    var rows = [head.join(',')];
    recs.forEach(function (r) {
      var x = r.res || {}, a = r.answers || {}, pts = {}; (x.items || []).forEach(function (i) { pts[i.id] = 1; });
      var why = !x.eligible ? '' : (x.part1Any ? 'part I' : '') + (x.part1Any && x.scoreMet ? ' + ' : '') + (x.scoreMet ? 'part II score' : '');
      var row = [r.id, r.createdAt, r.assisted ? 'helper' : 'resident', r.lang, r.contact ? r.contact.name : '', r.contact ? r.contact.mobile : '', a.age, x.eligible ? 'yes' : 'no', why, (x.part1 || []).length, x.score, r.sample ? 'yes' : ''];
      PART_I.forEach(function (it) { row.push(a[it.id] === true ? 'yes' : 'no'); });
      PART_II.forEach(function (it) { row.push(pts[it.id] ? 'yes' : 'no'); });
      rows.push(row.map(csvCell).join(','));
    });
    if (!recs.length) { S.msg = 'There are no screenings to export yet.'; render(); return; }
    if (!S.dl) { downloadFile('kidney-screenings.csv', rows.join('\n')); S.msg = ''; render(); return; }
    try { await S.dl.save({ filename: 'kidney-screenings.csv', data: rows.join('\n') }); S.msg = ''; }
    catch (e) { S.msg = e && e.code === 'declined' ? '' : 'Could not save the file.'; }
    render();
  }
  function sampleSet() {
    var now = Date.now();
    /* [age, items ticked, name, mobile] */
    var defs = [
      [62, ['i1', 'ii6', 'ii1'], 'Asha K', '9847000001'],            /* Part I and score 4 */
      [55, ['ii6', 'ii10', 'ii1'], null],                             /* score exactly 4 */
      [48, ['ii6', 'ii10'], null],                                    /* score 3, just below */
      [71, ['i2', 'ii7'], 'Moideen P', '9847000004'],                 /* Part I */
      [44, ['i5'], 'Suresh V', '9847000005'],                         /* Part I only, score 1 */
      [36, ['ii2', 'ii3', 'ii11'], null],                             /* score 3 */
      [33, [], null],                                                 /* nothing */
      [58, ['i3', 'i4'], 'Leela T', '9847000008'],                    /* confirmed kidney disease, past dialysis */
      [66, ['ii8', 'ii9'], null],                                     /* age 60+ (2) + 2 = 4, no Part I */
      [52, ['ii11', 'ii9'], null],                                    /* 1 + 1 + 1 = 3 */
      [41, ['ii1', 'ii3', 'ii10', 'ii11'], 'Joseph K', '9847000011'], /* score 5 */

    return defs.map(function (d, i) {

      PART_I.forEach(function (x) { a[x.id] = d[1].indexOf(x.id) >= 0; });

      return { id: 'ex_' + (i + 1), data: { schema: SCHEMA, answers: a, createdAt: new Date(now - i * 7.3 * 3600 * 1000).toISOString(), lang: i % 3 === 0 ? 'ml' : 'en', assisted: i % 4 === 1, contact: d[2] ? { name: d[2], mobile: d[3] } : null, sample: true } };
    });
  }
  async function loadSamples() {
    S.busy = 'samples'; S.msg = ''; render();
    try {
      var set = sampleSet();
      for (var i = 0; i < set.length; i++) {
        if (S.db) await S.db.doc('screenings/' + set[i].id).set(set[i].data);
        else enqueue(Object.assign({ id: set[i].id }, set[i].data));
      }

  }
  async function removeSamples() {
    S.busy = 'rm'; S.msg = ''; S.confirm = ''; render();
    try {
      var ids = allRecords().filter(function (r) { return r.sample; }).map(function (r) { return r.id; });
      S.queue = S.queue.filter(function (r) { return !r.sample; }); saveQueue();
      for (var i = 0; i < ids.length; i++) { if (S.db && S.records[ids[i]]) await S.db.doc('screenings/' + ids[i]).delete(); }
      ids.forEach(function (id) { delete S.records[id]; if (S.careSel === id) S.careSel = null; });
    } catch (e) { S.msg = 'Could not remove the examples (' + (e && e.code) + ').'; }
    S.busy = ''; render();
  }
  async function removeLegacy() {
    S.busy = 'legacy'; S.msg = ''; S.confirm = ''; render();
    try {
      var ids = legacyIds();
      for (var i = 0; i < ids.length; i++) { await S.db.doc('screenings/' + ids[i]).delete(); delete S.records[ids[i]]; }
      S.msg = 'Deleted ' + ids.length + ' earlier-draft screenings.';
    } catch (e) { S.msg = 'Could not delete them (' + (e && e.code) + ').'; }

  }
  async function saveCfg(reset) {
    var d = reset ? Object.assign({}, DEFAULT_CONFIG) : Object.assign({}, S.cfg, S.cfgDraft || {});
    Object.keys(d).forEach(function (k) { if (k !== 'version') d[k] = Number(d[k]); });
    S.confirm = '';
    try { if (S.db) await S.db.doc('config/criteria').set(d); else localStorage.setItem(CFGKEY, JSON.stringify(d)); S.cfg = d; S.cfgDraft = null; S.msg = reset ? 'Form values restored.' : 'Scoring rules saved.'; }

  }

  /* ---------- events ---------- */
  function refreshNext() { var b = document.getElementById('nextBtn'); if (b) b.disabled = !stepValid(STEPS[S.stepIdx]); }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    if (act === 'lang') { S.lang = v; render(); }
    else if (act === 'theme') { S.theme = S.theme === 'dark' ? 'light' : 'dark'; applyTheme(); render(); }
    else if (act === 'toggle') { S[v] = !S[v]; render(); }
    else if (act === 'start') { if (!S.consent) return; S.screen = 'q'; S.stepIdx = 0; S.focusQ = true; render(); window.scrollTo(0, 0); }
    else if (act === 'tick') {
      var id = el.getAttribute('data-id'); S.a[id] = S.a[id] === true ? false : true;
      if (id.charAt(1) === 'i' || id.indexOf('ii') === 0) S.ack2 = true; else S.ack1 = true;
      render();
    }
    else if (act === 'none') {
      var p = el.getAttribute('data-p'), list = p === '1' ? PART_I : PART_II.filter(function (x) { return !x.derived; });
      list.forEach(function (x) { S.a[x.id] = false; }); S['ack' + p] = true; render();
    }
    else if (act === 'back') { if (S.stepIdx === 0) S.screen = 'welcome'; else S.stepIdx--; S.focusQ = true; render(); window.scrollTo(0, 0); }
    else if (act === 'next') {
      if (!stepValid(STEPS[S.stepIdx])) return;
      if (S.stepIdx >= STEPS.length - 1) { finish(); return; }
      S.stepIdx++; S.focusQ = true; render(); window.scrollTo(0, 0);
    }
    else if (act === 'contact') { S.sheet = true; render(); }
    else if (act === 'sheetclose') { var dlg = document.getElementById('sheet'); S.sheet = false; if (dlg && dlg.open) dlg.close(); render(); }
    else if (act === 'reset') { resetFlow(false); render(); window.scrollTo(0, 0); }
    else if (act === 'retake') { resetFlow(true); render(); window.scrollTo(0, 0); }
    else if (act === 'care') { S.view = 'care'; subscribe(); render(); window.scrollTo(0, 0); }
    else if (act === 'resident') { S.view = 'resident'; render(); window.scrollTo(0, 0); }
    else if (act === 'filter') { S.filter = v; S.careMode = 'records'; S.careSel = null; render(); }
    else if (act === 'rules') { S.careMode = 'rules'; S.careSel = null; S.msg = ''; render(); }
    else if (act === 'open') { S.careMode = 'records'; S.careSel = el.getAttribute('data-id'); render(); window.scrollTo(0, 0); }
    else if (act === 'closedetail') { S.careSel = null; S.careMode = 'records'; render(); }
    else if (act === 'csv') { exportCsv(); }
    else if (act === 'samples') { loadSamples(); }
    else if (act === 'confirmrm') { S.confirm = 'rmsamples'; render(); }
    else if (act === 'confirmlegacy') { S.confirm = 'rmlegacy'; render(); }
    else if (act === 'confirmreset') { S.confirm = 'cfgreset'; render(); }
    else if (act === 'confirmno') { S.confirm = ''; render(); }
    else if (act === 'rmsamples') { removeSamples(); }
    else if (act === 'rmlegacy') { removeLegacy(); }
    else if (act === 'cfgsave') { saveCfg(false); }
    else if (act === 'cfgreset') { saveCfg(true); }

  document.addEventListener('input', function (e) {
    var el = e.target, k = el.getAttribute && el.getAttribute('data-in'); if (!k) return;
    if (k === 'age') {
      S.a.age = el.value === '' ? undefined : Number(el.value);

      refreshNext();

    else if (k === 'cname') { S.contact.name = el.value; }
    else if (k === 'cmobile') { S.contact.mobile = el.value.replace(/\D/g, '').slice(0, 10); if (el.value !== S.contact.mobile) el.value = S.contact.mobile; }
    else if (k === 'query') { S.query = el.value; var pos = el.selectionStart; render(); var nq = document.getElementById('q'); if (nq) { nq.focus(); try { nq.setSelectionRange(pos, pos); } catch (x) { /* not supported */ } } }

  });

  /* ---------- boot ---------- */
  S.queue = loadQueue();
  try { if (localStorage.getItem(THEME_KEY) === 'dark') S.theme = 'dark'; } catch (e) { /* storage unavailable */ }
  applyTheme();
  S.standalone = !(window.claude && window.claude.use);
  if (S.standalone) { try { var sc = JSON.parse(localStorage.getItem(CFGKEY) || 'null'); if (sc) S.cfg = Object.assign({}, DEFAULT_CONFIG, sc); } catch (e) { /* ignore */ } }
  try { if (location.hash === '#care') S.view = 'care'; } catch (e) { /* no hash */ }
  render();
  (async function () {
    if (!window.claude || !window.claude.use) return;
    try { S.db = await window.claude.use('db'); } catch (e) { S.db = null; }
    try { S.user = await window.claude.use('user'); if (S.user) S.canEdit = await S.user.canEdit(); } catch (e) { /* no user */ }
    try { S.dl = await window.claude.use('downloads'); } catch (e) { S.dl = null; }
    if (S.db) {
      try {
        S.db.doc('config/criteria').onSnapshot(function (snap) {
          if (snap.exists) { S.cfg = Object.assign({}, DEFAULT_CONFIG, snap.data()); if (S.view === 'care' && !document.activeElement.matches('input')) render(); }
        }, function () { /* keep defaults */ });
      } catch (e) { /* keep defaults */ }
      if (S.view === 'care') subscribe();
      syncQueue();
    }
    if (S.view === 'care') render();
  })();
})();
</script>
